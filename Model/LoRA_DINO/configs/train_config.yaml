data:
  train_dir: "multimodal-brisc/train"
  train_ann: "multimodal-brisc/train.csv"
  val_dir: "multimodal-brisc/val"
  val_ann: "multimodal-brisc/val.csv"
  batch_size: 8
  num_workers: 8
  negative_sampling_rate: 3.0

model:
  config_path: "groundingdino/config/GroundingDINO_SwinT_OGC.py"
  weights_path: "weights/groundingdino_swint_ogc.pth"

training:
  num_epochs: 130
  learning_rate: 2e-4
  save_dir: "weights"
  save_frequency: 5
  warmup_epochs: 5
  use_lora: true
  visualization_frequency: 5
  use_gradient_clipping: true
  max_grad_norm: 5.0